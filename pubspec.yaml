name: ym_flutter_keyboard_visibility
description: Flutter plugin for discovering the state of the soft-keyboard visibility on Android and iOS.
version: 1.0.0
homepage: https://github.com/yashmanghnani/ym_flutter_keyboard_visibility
issue: https://github.com/yashmanghnani/ym_flutter_keyboard_visibility/issues
repository: https://github.com/MisterJimson/ym_flutter_keyboard_visibility

environment:
  sdk: '3.9.2'

dependencies:
  meta: ^1.16.0
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.1.7
  mockito: ^5.0.17
  pedantic: ^1.11.1
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jrai.flutter_keyboard_visibility
        pluginClass: FlutterKeyboardVisibilityPlugin
      ios:
        pluginClass: FlutterKeyboardVisibilityPlugin