name: ym_flutter_keyboard_visibility
description: A Flutter plugin for observing soft-keyboard visibility on Android and iOS.
version: 1.1.0
homepage: https://github.com/yashmanghnani/ym_flutter_keyboard_visibility
issue_tracker: https://github.com/yashmanghnani/ym_flutter_keyboard_visibility/issues
repository: https://github.com/yashmanghnani/ym_flutter_keyboard_visibility
topics:
  - keyboard
  - keyboard-visibility
  - flutter-plugin

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  meta: ^1.19.0
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jrai.flutter_keyboard_visibility
        pluginClass: FlutterKeyboardVisibilityPlugin
      ios:
        pluginClass: FlutterKeyboardVisibilityPlugin
