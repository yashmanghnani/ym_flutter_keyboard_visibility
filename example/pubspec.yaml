name: flutter_keyboard_visibility_example
description: Demonstrates how to use the flutter_keyboard_visibility plugin.
version: 1.1.1

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  ym_flutter_keyboard_visibility:
    path: ../

  cupertino_icons: ^1.0.8
  material_ui: ^1.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
